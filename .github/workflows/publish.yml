name: Publish
on:
  push:
    branches:
      - master
    paths:
      - RELEASE_NOTES.md
      - .github/workflows/publish.yml
jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
          os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore Tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet paket restore

      - name: Build
        run: dotnet build -c Release src/Assembler.sln

      - name: Test
        run: dotnet test -l "console;verbosity=detailed" -c Release --no-build --nologo src/Assembler.sln
  pack:
    name: Pack
    runs-on: windows-latest
    needs: test
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this job
      contents: write
      packages: write 
    steps:
      - name: Checkout 
        uses: actions/checkout@v6

      - name: Install Dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore Tools
        run: dotnet tool restore

      - name: Paket Restore
        run: dotnet paket restore

      - name: Build
        run: dotnet build -c Release src\Assembler.sln

      - name: Pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet aardpack src\Assembler.sln --skip-build

      - name: Upload Packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: bin\pack

      - name: GitHub Packages
        env:
          NUGET_KEY: ${{ secrets.GITHUB_TOKEN }}
        shell: cmd
        run: dotnet nuget push "bin\pack\*.nupkg" -k %NUGET_KEY% -s "https://nuget.pkg.github.com/aardvark-community/index.json" --skip-duplicate

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet
        shell: cmd
        run: dotnet nuget push "bin\pack\*.nupkg" -k ${{steps.login.outputs.NUGET_API_KEY}} -s "https://api.nuget.org/v3/index.json" --skip-duplicate
 